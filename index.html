<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Diário de Treino</title>
<meta name="description" content="Registo de cargas e reps do plano Push, Pull, Legs e Arms.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ECEEEA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="preload" href="fonts/barlow-condensed-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/barlow-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Barlow";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/barlow-400.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/barlow-500.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-600.woff2) format("woff2")}
@font-face{font-family:"Barlow";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-700.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:500;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-500.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/barlow-condensed-700.woff2) format("woff2")}
/* Layout: uma coluna à medida do polegar — a semana em discos no topo, um cartão por exercício com a grelha série a série, e o temporizador de descanso preso ao fundo. */
:root{
  --bg:#ECEEEA;--surface:#FFFFFF;--sunk:#E2E5E0;--raised:#FFFFFF;--line:#D0D5CD;--fg:#14171A;--muted:#5A6267;
  --accent:#1D4ED0;--on-accent:#FFFFFF;
  --ok:#1B7A4A;--on-ok:#FFFFFF;--ok-soft:#DBEFE2;
  --up:#AF440D;--up-soft:#FBE6D6;--bad:#B3261E;
  --push:#D3302F;--on-push:#FFFFFF;--pull:#2457D6;--on-pull:#FFFFFF;--legs:#E2AC00;--on-legs:#1B1500;--arms:#23803A;--on-arms:#FFFFFF;
  --shadow:0 1px 2px rgb(20 23 26 / .10);--shadow-lg:0 10px 28px rgb(20 23 26 / .22);
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-code:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0E1113;--surface:#171B1E;--sunk:#1F2428;--raised:#343C42;--line:#2B3237;--fg:#E5E8E3;--muted:#99A2A7;
    --accent:#8AABFF;--on-accent:#0A1430;
    --ok:#5BC891;--on-ok:#06210F;--ok-soft:#163222;
    --up:#FFA066;--up-soft:#3B2416;--bad:#FF8A80;
    --shadow:0 1px 2px rgb(0 0 0 / .5);--shadow-lg:0 10px 28px rgb(0 0 0 / .6);
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;touch-action:manipulation;background:var(--bg)}
body{margin:0;padding-top:env(safe-area-inset-top,0px);background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:10px 150px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;padding:3px;background:var(--sunk);border-radius:12px}
.tab{height:38px;border-radius:9px;font-weight:600;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--raised);color:var(--fg);box-shadow:var(--shadow)}

.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wcell{display:grid;justify-items:center;gap:6px}
.wd{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.wd.today{color:var(--accent);font-weight:700}
.plate{position:relative;width:min(46px,100%);aspect-ratio:1;border-radius:50%;border:3px solid var(--c);background:var(--surface);color:var(--fg);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:13px;letter-spacing:.02em}
.plate[aria-pressed="true"]{background:var(--c);color:var(--on-c)}
.plate:active{transform:scale(.96)}
.tick{position:absolute;right:-5px;bottom:-5px;width:18px;height:18px;border-radius:50%;background:var(--ok);color:var(--on-ok);display:grid;place-items:center;border:2px solid var(--bg)}
.restmark{width:min(46px,100%);aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--line)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}

.datepill input{height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-weight:600;font-size:16px}
.icon-btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-weight:600;font-size:14px}
.icon-btn[aria-pressed="true"]{color:var(--fg)}
.note{margin:0;padding:10px 12px;border-radius:12px;background:var(--sunk);font-size:14px;line-height:1.4}
.note.up{background:var(--up-soft)}
.note.up b{color:var(--up)}
.panel{display:grid;gap:10px;padding:14px;border-radius:16px;border:1px solid var(--line);background:var(--surface)}
.panel h3{margin:0;font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.1}
.panel p{margin:0;color:var(--muted);font-size:14px;line-height:1.4}
.actions{display:flex;flex-wrap:wrap;gap:8px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 12px 8px}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--sunk);color:var(--muted);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:15px}
.ex-name{margin:0;font-family:var(--f-display);font-weight:600;font-size:21px;line-height:1.12;text-wrap:balance}
.meta{margin-top:3px;color:var(--muted);font-size:13.5px;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--up-soft);color:var(--up);font-weight:600;font-size:13.5px;line-height:1.25}
.last{color:var(--muted);font-size:13px}
.swap{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);color:var(--accent);font-weight:600;font-size:13.5px}
.swap:active,.btn:active,.add:active,.icon-btn:active{background:var(--sunk)}
.grid{display:grid;grid-template-columns:36px minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr) 44px;gap:6px;align-items:center}
.ghead{padding:12px 0 4px;font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.row{padding-block:3px}
.setno{text-align:center;font-family:var(--f-display);font-weight:600;font-size:16px;color:var(--muted)}
.prev{font-family:var(--f-display);font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.in{width:100%;height:44px;padding:0 4px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);color:var(--fg);text-align:center;font-family:var(--f-display);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.in::placeholder{color:var(--muted);opacity:.6;font-weight:500}
.in:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.in:disabled{opacity:.6}
.row.done .in{background:var(--ok-soft);border-color:transparent}
.chk{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);color:var(--muted);display:grid;place-items:center}
.chk:active{transform:scale(.94)}
.row.done .chk{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.add{height:38px;margin-top:4px;padding:0 10px;border-radius:10px;color:var(--accent);font-weight:600;font-size:14px}
.ss{display:grid;gap:8px;padding:8px;border:1.5px dashed var(--line);border-radius:20px}
.ss-label{padding:2px 6px 0;color:var(--muted);font-size:13px;line-height:1.35}

textarea{width:100%;min-height:68px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font-size:16px;line-height:1.4;resize:vertical}
textarea:focus{outline:none;border-color:var(--accent)}
textarea.code{min-height:84px;background:var(--sunk);font-family:var(--f-code);font-size:16px;word-break:break-all}

.sess,.prog{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.sess>summary,.prog>summary{list-style:none;cursor:pointer;padding:12px 14px}
.sess>summary{display:flex;align-items:center;gap:10px}
.prog>summary{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:10px}
.sess>summary::-webkit-details-marker,.prog>summary::-webkit-details-marker{display:none}
.chev{flex:none;margin-left:auto;color:var(--muted)}
details[open]>summary .chev{transform:rotate(90deg)}
.lines{display:grid;gap:9px;padding:0 14px 14px}
.line{display:grid;gap:1px;min-width:0}
.line>b{font-weight:600}
.line>span{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.btn{height:40px;padding:0 14px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.danger{color:var(--bad)}
.btn.danger[data-armed]{background:var(--bad);border-color:var(--bad);color:var(--surface)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:14px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);box-shadow:var(--shadow-lg)}
.dock.fin{background:var(--ok);color:var(--on-ok)}
.dbtn{min-width:42px;height:40px;padding:0 8px;border-radius:10px;border:1px solid color-mix(in srgb,currentColor 35%,transparent);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.dbtn:active{background:color-mix(in srgb,currentColor 16%,transparent)}
.toast{position:fixed;left:16px;right:16px;bottom:calc(104px + env(safe-area-inset-bottom,0px));z-index:30;max-width:440px;margin-inline:auto;padding:10px 14px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:14px;box-shadow:var(--shadow-lg)}
@media (prefers-reduced-motion: no-preference){
  .chev{transition:transform .15s ease}
  .dock{animation:rise .18s ease-out}
  @keyframes rise{from{transform:translateY(100%)}to{transform:none}}
}
</style>
</head>
<body>
<div class="wrap">
  <header style="display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding-block:6px 14px">
    <h1 style="margin:0;font-family:var(--f-display);font-weight:700;font-size:28px;line-height:1;letter-spacing:.005em">Diário de Treino</h1>
  </header>

  <nav class="tabs" role="tablist" aria-label="Secções">
    <button class="tab" role="tab" id="tab-treino" data-view="treino" aria-selected="true" aria-controls="v-treino">Treino</button>
    <button class="tab" role="tab" id="tab-historico" data-view="historico" aria-selected="false" aria-controls="v-historico">Histórico</button>
    <button class="tab" role="tab" id="tab-progresso" data-view="progresso" aria-selected="false" aria-controls="v-progresso">Progresso</button>
  </nav>

  <p id="banner" hidden style="margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--up-soft);font-size:14px;line-height:1.4"></p>

  <section id="v-treino" role="tabpanel" aria-labelledby="tab-treino" style="display:grid;gap:18px;margin-top:18px">
    <div id="top-cards" style="display:grid;gap:10px"></div>
    <div id="week" class="week" aria-label="Esta semana"></div>
    <div id="session-head"></div>
    <div id="workout" style="display:grid;gap:10px"></div>
    <label for="notes" style="display:grid;gap:6px">
      <span style="font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">Notas da sessão</span>
      <textarea id="notes" rows="2" maxlength="2000" placeholder="Ex.: máquina ocupada, troquei a ordem dos exercícios"></textarea>
    </label>
  </section>
  <section id="v-historico" role="tabpanel" aria-labelledby="tab-historico" hidden style="display:grid;gap:16px;margin-top:18px"></section>
  <section id="v-progresso" role="tabpanel" aria-labelledby="tab-progresso" hidden style="display:grid;gap:16px;margin-top:18px"></section>
</div>

<div id="dock" class="dock" hidden>
  <div id="dock-bar" style="position:absolute;left:0;top:0;width:100%;height:4px;transform-origin:left;background:var(--c,var(--accent))"></div>
  <div style="max-width:560px;margin:0 auto;display:flex;align-items:center;gap:12px">
    <div style="flex:1;min-width:0">
      <div id="dock-label" style="font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.75">Descanso</div>
      <div id="dock-sub" style="font-size:14px;font-weight:500;line-height:1.25;overflow-wrap:anywhere"></div>
    </div>
    <div id="dock-time" style="font-family:var(--f-display);font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums">0:00</div>
    <div style="display:flex;gap:6px">
      <span id="dock-adj" style="display:flex;gap:6px">
        <button class="dbtn" data-t="-15" aria-label="Menos 15 segundos">−15</button>
        <button class="dbtn" data-t="15" aria-label="Mais 15 segundos">+15</button>
      </span>
      <button class="dbtn" data-t="x" aria-label="Fechar temporizador">✕</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<input type="file" id="file-in" accept=".json,.csv,application/json,text/csv,text/plain" hidden>

<script>
(() => {
'use strict';

/* ---------- Plano: Push · Pull · Descanso · Legs · Arms · Descanso · Descanso ---------- */
const CORE = [
  { id:'cable-crunch', name:'Crunch na polia', sets:3, min:12, max:15, rest:60, inc:2.5, core:true },
  { id:'hanging-leg-raise', name:'Elevação de pernas suspenso', sets:3, min:10, max:15, rest:60, inc:2.5, bw:true, core:true,
    upHint:'Topo do intervalo: pernas esticadas ou descida mais lenta' },
];
const DAYS = {
  push:{ name:'Push', sub:'Peito, ombros e tríceps', items:[
    { id:'bench', name:'Supino plano com barra', sets:4, min:6, max:8, rest:150, inc:2.5 },
    { id:'incline-db', name:'Supino inclinado com halteres', sets:3, min:8, max:10, rest:120, inc:2 },
    { id:'db-press', name:'Press de ombros com halteres', sets:3, min:8, max:10, rest:120, inc:2 },
    { id:'fly', name:'Aberturas na polia ou peck deck', sets:3, min:12, max:15, rest:90, inc:2.5 },
    { id:'lat-raise-push', name:'Elevações laterais', sets:4, min:12, max:15, rest:90, inc:1 },
    { id:'tri-rope', name:'Tríceps na polia com corda', sets:3, min:10, max:12, rest:90, inc:2.5 },
  ]},
  pull:{ name:'Pull', sub:'Costas e bíceps', items:[
    { id:'pullup', name:'Elevações na barra', sets:4, min:6, max:10, rest:150, inc:2.5, bw:true,
      upHint:'Topo do intervalo: junta 2,5 kg com cinto ou halter',
      alt:{ id:'pulldown', name:'Puxada à frente' } },
    { id:'bb-row', name:'Remada curvada com barra', sets:3, min:8, max:10, rest:150, inc:2.5 },
    { id:'close-pulldown', name:'Puxada à frente com pega fechada', sets:3, min:10, max:12, rest:120, inc:2.5 },
    { id:'cable-row', name:'Remada sentada na polia', sets:3, min:10, max:12, rest:120, inc:2.5 },
    { id:'face-pull', name:'Face pull', sets:3, min:12, max:15, rest:90, inc:2.5 },
    { id:'hammer', name:'Curl martelo', sets:3, min:10, max:12, rest:90, inc:2 },
  ]},
  legs:{ name:'Legs', sub:'Pernas e core', items:[
    { id:'squat', name:'Agachamento com barra', sets:3, min:6, max:8, rest:150, inc:2.5 },
    { id:'rdl', name:'Peso morto romeno', sets:3, min:8, max:10, rest:150, inc:2.5 },
    { id:'leg-press', name:'Leg press', sets:3, min:10, max:12, rest:120, inc:5 },
    { id:'leg-curl', name:'Leg curl', sets:3, min:10, max:12, rest:90, inc:2.5 },
    { id:'calf', name:'Elevação de gémeos em pé', sets:3, min:12, max:15, rest:90, inc:5 },
    ...CORE,
  ]},
  arms:{ name:'Arms', sub:'Braços, ombros e core', items:[
    { id:'ez-curl', name:'Curl com barra EZ', sets:3, min:8, max:10, rest:0, inc:2.5, ss:'A' },
    { id:'dips', name:'Fundos nas paralelas', sets:3, min:8, max:12, rest:90, inc:2.5, bw:true, ss:'A',
      upHint:'Topo do intervalo: junta 2,5 kg com cinto ou halter' },
    { id:'incline-curl', name:'Curl inclinado com halteres', sets:3, min:10, max:12, rest:0, inc:2, ss:'B' },
    { id:'skull', name:'Extensão de tríceps deitado (barra EZ)', sets:3, min:10, max:12, rest:90, inc:2.5, ss:'B' },
    { id:'preacher', name:'Curl no banco Scott', sets:3, min:12, max:15, rest:0, inc:2.5, ss:'C' },
    { id:'oh-ext', name:'Extensão de tríceps acima da cabeça na polia', sets:3, min:12, max:15, rest:90, inc:2.5, ss:'C' },
    { id:'lat-raise-arms', name:'Elevações laterais', sets:3, min:15, max:20, rest:90, inc:1 },
    ...CORE,
  ]},
};
const ORDER = ['push', 'pull', 'legs', 'arms'];
const WEEK = ['push', 'pull', null, 'legs', 'arms', null, null]; // Seg..Dom

const EX = {}, SLOT = {};
for (const day of ORDER) for (const it of DAYS[day].items) {
  const group = it.core ? 'core' : day;
  if (!SLOT[it.id]) SLOT[it.id] = it;
  if (!EX[it.id]) EX[it.id] = { ...it, group };
  if (it.alt && !EX[it.alt.id]) EX[it.alt.id] = { ...it, alt:undefined, bw:false, upHint:undefined, ...it.alt, group, altOf:it.id };
}

/* ---------- Datas e números ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseISO(s); d.setDate(d.getDate() + n); return iso(d); };
const dowMon = s => (parseISO(s).getDay() + 6) % 7;
const weekStart = s => addDays(s, -dowMon(s));
const diffDays = (a, b) => Math.round((parseISO(b) - parseISO(a)) / 864e5);
const WDS = ['Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb', 'Dom'];
const wds = ['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'];
const MOS = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const fmtShort = s => { const d = parseISO(s); return `${d.getDate()} ${MOS[d.getMonth()]}`; };
const fmtDate = s => `${wds[dowMon(s)]}, ${fmtShort(s)}`;
const round2 = n => Math.round(n * 100) / 100;
const fmtKg = n => n == null ? '' : String(round2(n)).replace('.', ',');
const fmtRest = s => s < 120 ? `${s} s` : (s % 60 ? `${Math.floor(s / 60)}:${pad(s % 60)} min` : `${s / 60} min`);
const fmtVol = v => v >= 1000 ? `${String(Math.round(v / 100) / 10).replace('.', ',')} t` : `${Math.round(v)} kg`;
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const $ = id => document.getElementById(id);

const DOC_ID = /^\d{4}-\d{2}-\d{2}_(push|pull|legs|arms)$/;
const KEY = /^[a-z0-9-]{1,40}$/;
const okNum = v => typeof v === 'number' && isFinite(v) && v >= 0 && v < 1000;
function clean(id, body) {

}
function readStore() {

const sid = () => `${S.date}_${S.day}`;

/* ---------- Lógica do plano ---------- */
function lastFor(exId) {
  const me = sid(); let best = null;

}

    const lm = logged(d.sets[it.id]).length, la = logged(d.sets[it.alt.id]).length;
    if (la && !lm) return it.alt.id;
    if (lm && !la) return it.id;
  }
  const a = lastFor(it.id), b = lastFor(it.alt.id);

}
function slotInfo(it) {
  const exId = chosenId(it), ex = EX[exId], d = cur();
  const sets = (d && d.sets[exId]) || [];
  const prev = lastFor(exId);
  const prevL = prev ? logged(prev.sets[exId]) : [];
  const firstN = prevL.slice(0, ex.sets);
  const earned = prevL.length >= ex.sets && firstN.every(s => s.r >= ex.max);

// Sugestão para a série i: peso da série anterior de hoje, senão o da última sessão (+ incremento se chegaste ao topo das reps).

function relTxt(date) {

/* ---------- Semana ---------- */
function doneThisWeek() {

}

  if (todays.length) return { day:todays[0].day, date:t };

/* ---------- Temporizador de descanso ---------- */
let actx = null;

  if (!S.sound) return;
  try {
    if (navigator.audioSession) navigator.audioSession.type = 'ambient'; // mistura com a música e respeita o modo silêncio
    if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) actx = new AC(); }
    if (actx && actx.state !== 'running') actx.resume();

}
function beep() {

  try {

// Partilha o ficheiro (no iPhone abre a folha de partilha: "Guardar em Ficheiros"); se não der, descarrega.

    if (!/^\d{4}-\d{2}-\d{2}$/.test(date) || !DAYS[day]) continue;

/* ---------- Progresso ---------- */
const e1rm = s => s.w * (1 + s.r / 30);

function metric(L, ex) {

function bestSet(L) { let b = null; for (const s of L) if (s.w > 0 && (!b || e1rm(s) > e1rm(b))) b = s; return b; }

  const P = vals.map((v, i) => [x(i).toFixed(1), y(v).toFixed(1)]);
  const line = P.map((q, i) => `${i ? 'L' : 'M'}${q[0]},${q[1]}`).join(' ');
  const fill = hi !== lo ? `<path d="${line} L${P[P.length - 1][0]},${h} L${P[0][0]},${h} Z" style="fill:var(--accent);fill-opacity:.13;stroke:none"/>` : '';
  const area = P.length > 1 ? `${fill}<path d="${line}" style="fill:none;stroke:var(--accent);stroke-width:1.75;stroke-linejoin:round;stroke-linecap:round"/>` : '';
  const [lx, ly] = P[P.length - 1];
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true" style="display:block;flex:none;overflow:visible">${area}<circle cx="${lx}" cy="${ly}" r="3.2" style="fill:var(--accent)"/></svg>`;
}
function bigChart(pts, ex) {
  const W = 320, H = 156, L = 46, R = 14, T = 14, B = 26;
  const vals = pts.map(q => q.v), lo = Math.min(...vals), hi = Math.max(...vals), flat = hi === lo;
  const x = i => pts.length === 1 ? (L + W - R) / 2 : L + i * (W - L - R) / (pts.length - 1);
  const y = v => flat ? (T + H - B) / 2 : T + (hi - v) / (hi - lo) * (H - T - B);
  const fv = v => ex.bw ? String(Math.round(v)) : fmtKg(Math.round(v * 2) / 2);
  const P = pts.map((q, i) => [x(i), y(q.v)]);

  const txt = 'fill:var(--muted);font-size:11px;font-family:var(--f-body)';
  let g = '';
  for (const v of (flat ? [lo] : [hi, lo])) {

  }

  if (P.length > 1) g += `<path d="${line}" style="fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round"/>`;
  g += P.map(([a, b], i) => `<circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="${i === P.length - 1 ? 4.5 : 2.6}" style="fill:${i === P.length - 1 ? 'var(--accent)' : 'var(--surface)'};stroke:var(--accent);stroke-width:1.75"/>`).join('');
  g += `<text x="${P[0][0].toFixed(1)}" y="${H - 7}" text-anchor="${pts.length === 1 ? 'middle' : 'start'}" style="${txt}">${fmtShort(pts[0].date)}</text>`;
  if (pts.length > 1) g += `<text x="${P[P.length - 1][0].toFixed(1)}" y="${H - 7}" text-anchor="end" style="${txt}">${fmtShort(pts[pts.length - 1].date)}</text>`;
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Evolução de ${esc(ex.name)}" style="display:block;max-width:100%;overflow:visible">${g}</svg>`;

  else { const b = bestSet(last.L); bestTxt = b ? `${fmtKg(b.w)} kg × ${b.r}` : ''; }
  let delta = '', dc = 'var(--muted)';
  if (pts.length > 1) {

    delta = `${dv > 0 ? '+' : dv < 0 ? '−' : ''}${Math.abs(dv)}${ex.bw ? ' reps' : '%'}`;

  }
  const hist = pts.slice().reverse().slice(0, 12).map(q => `<div class="line"><b>${fmtDate(q.date)}</b><span>${esc(setsLine(q.L, ex))}</span></div>`).join('');
  return `<details class="prog"><summary>
<span style="min-width:0;display:grid;gap:2px"><b style="font-weight:600;line-height:1.25">${esc(ex.name)}</b><span style="color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums">${esc(bestTxt)} · ${fmtShort(last.date)}</span></span>
<span style="display:flex;align-items:center;gap:8px">${spark(pts.map(q => q.v))}<span style="min-width:3.6em;text-align:right;font-weight:600;font-size:13.5px;font-variant-numeric:tabular-nums;color:${dc}">${delta}</span>${CHEV}</span>
</summary>
<div style="display:grid;gap:14px;padding:2px 14px 14px">
  <div><div style="margin-bottom:6px;font-size:11.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)">${ex.bw ? 'Reps totais por sessão' : '1RM estimado, média das séries (kg)'}</div>${bigChart(pts, ex)}</div>
  <div class="lines" style="padding:0">${hist}</div>
</div></details>`;
}
function renderProgress() {
  const box = $('v-progresso');
  const sessions = Object.values(S.docs).sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : a.updatedAt - b.updatedAt);
  const groups = [['push', 'Push'], ['pull', 'Pull'], ['legs', 'Legs'], ['arms', 'Arms'], ['core', 'Core']];
  let html = '';
  for (const [g, label] of groups) {
    const rows = [];
    for (const id of Object.keys(EX)) {
      const ex = EX[id]; if (ex.group !== g) continue;
      const pts = [];
      for (const d of sessions) { const L = logged(d.sets[id]); if (!L.length) continue; const v = metric(L, ex); if (v != null) pts.push({ date:d.date, v, L }); }
      if (pts.length) rows.push(progHTML(ex, pts));

<div style="display:flex;align-items:center;gap:8px"><span class="dot" style="--c:var(--${g === 'core' ? 'muted' : g})"></span><h3 style="margin:0;font-family:var(--f-display);font-weight:700;font-size:21px">${label}</h3></div>${rows.join('')}</section>`;
  }

    : emptyHTML('O progresso aparece aqui', 'Depois da primeira sessão vês, por exercício, a melhor série e a evolução semana a semana.');
}

  for (const b of document.querySelectorAll('.tab')) b.setAttribute('aria-selected', String(b.dataset.view === v));
  $('v-treino').hidden = v !== 'treino'; $('v-historico').hidden = v !== 'historico'; $('v-progresso').hidden = v !== 'progresso';
  renderView(); window.scrollTo(0, 0);
}
let toastId = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastId); toastId = setTimeout(() => { t.hidden = true; }, 3800); }

/* ---------- Eventos ---------- */
document.querySelector('.tabs').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) setView(b.dataset.view); });
$('week').addEventListener('click', e => { const b = e.target.closest('[data-day]'); if (b) pickDay(b.dataset.day); });
$('session-head').addEventListener('change', e => {
  if (e.target.id !== 'session-date') return;
  S.date = e.target.value || S.today; S.picked = true;
  renderWeek(); renderWorkout();
});
$('session-head').addEventListener('click', e => {
  if (!e.target.closest('#sound')) return;
  S.sound = !S.sound; writeStore();
  if (S.sound) { unlockAudio(); beep(); }
  renderHead();
});
const wk = $('workout');
wk.addEventListener('input', e => {
  const inp = e.target.closest('.in'); if (!inp) return;
  const card = inp.closest('.card'), row = inp.closest('.row');
  const s = setAt(card.dataset.ex, +row.dataset.i);
  if (inp.dataset.f === 'w') s.w = parseKg(inp.value);
  else { const r = parseReps(inp.value); if (r > 0 && !(s.r > 0) && !s.t) s.t = Date.now(); s.r = r; }
  touch(); refreshCard(card);
});
wk.addEventListener('change', e => {
  const inp = e.target.closest('.in'); if (!inp) return;
  const card = inp.closest('.card'), row = inp.closest('.row'), i = +row.dataset.i;
  const info = slotInfo(SLOT[card.dataset.slot]), s = info.sets[i];
  // reps escritas à mão com o kg vazio: usa o peso sugerido que estava no campo
  if (inp.dataset.f === 'r' && s && s.r > 0 && s.w == null) {
    const sug = suggest(info, i);
    if (sug.w != null) { s.w = sug.w; touch(); }
  }
  inp.value = inp.dataset.f === 'w' ? (s && s.w != null ? fmtKg(s.w) : '') : (s && s.r != null ? String(s.r) : '');
  refreshCard(card);
});
wk.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  const card = b.closest('.card'); if (!card) return;
  if (b.hasAttribute('data-chk')) return onCheck(card, b.closest('.row'));
  const it = SLOT[card.dataset.slot];
  if (b.hasAttribute('data-add')) { const info = slotInfo(it); setAt(info.exId, Math.max(info.ex.sets, info.sets.length)); touch(); rerenderCard(card); return; }
  if (b.hasAttribute('data-swap')) { const now = chosenId(it), d = ensureCur(); d.variants[it.id] = now === it.id ? it.alt.id : it.id; touch(); rerenderCard(card); }
});
$('v-treino').addEventListener('focusout', () => setTimeout(() => { if (S.needsRender && !editing()) renderWorkout(); }, 80));
$('notes').addEventListener('input', e => { ensureCur().notes = e.target.value.slice(0, 2000); touch(); });
document.addEventListener('click', e => {
  const t = e.target.closest('button'); if (!t || t.disabled) return;
  if (t.hasAttribute('data-goto')) return setView(t.dataset.goto);
  if (t.hasAttribute('data-backup')) return doBackup();
  if (t.hasAttribute('data-csv')) { shareFile(`diario-treino-${S.today}.csv`, csvText(), 'text/csv').then(r => { if (r === 'fail') toast('Não foi possível exportar.'); }); return; }
  if (t.hasAttribute('data-import-file')) return $('file-in').click();
  if (t.hasAttribute('data-import-code')) return importCode(t.dataset.importCode);
  if (t.hasAttribute('data-show-import')) { const b = $('import-box'); if (b) { b.hidden = !b.hidden; if (!b.hidden) $('hist-code').focus(); } return; }
  if (t.hasAttribute('data-hide-install')) { S.hideInstall = true; writeStore(); renderTopCards(); return; }
  if (t.hasAttribute('data-later')) { S.remindLater = Date.now(); renderTopCards(); return; }
  if (t.hasAttribute('data-edit')) { const d = S.docs[t.dataset.edit]; if (d) { S.day = d.day; S.date = d.date; S.picked = true; renderWeek(); setView('treino'); } return; }
  if (t.hasAttribute('data-del')) {
    if (!t.hasAttribute('data-armed')) {
      t.setAttribute('data-armed', ''); t.textContent = 'Toca outra vez para apagar';
      setTimeout(() => { if (t.isConnected) { t.removeAttribute('data-armed'); t.textContent = 'Apagar'; } }, 4000);
      return;
    }
    removeSession(t.dataset.del);
  }
});
$('dock').addEventListener('click', e => {
  const b = e.target.closest('[data-t]'); if (!b) return;
  if (b.dataset.t === 'x') return hideDock();
  if (!S.timer) return;
  S.timer.end += +b.dataset.t * 1000;
  S.timer.total = Math.max(S.timer.total, S.timer.end - Date.now());
  tick();
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { checkToday(); if (S.timer) { wakeOn(); tick(); } }
  else if (S.reload) S.reload();
});
window.addEventListener('pageshow', checkToday);

/* ---------- Funcionar sem rede e atualizar ---------- */
if ('serviceWorker' in navigator) {
  const hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register('sw.js').catch(() => {});
  let done = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadController || done) return;
    const go = () => { if (!done) { done = true; location.reload(); } };
    if (editing() || S.timer) S.reload = go; else go();
  });
}
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch {}

/* ---------- Arranque ---------- */
readStore();
{ const d = defaultSelection(); S.day = d.day; S.date = d.date; }
renderWeek(); renderWorkout();
})();
</script>
</body>
</html>
