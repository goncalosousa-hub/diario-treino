name: Servidor de avisos

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publicar no Cloudflare
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error title=Faltam segredos::Cria CLOUDFLARE_API_TOKEN e CLOUDFLARE_ACCOUNT_ID em Settings > Secrets and variables > Actions."
            exit 1
          fi
          set +e
          npx --yes wrangler@4.148.0 deploy > deploy.log 2>&1
          code=$?
          set -e
          cat deploy.log
          if [ $code -ne 0 ]; then
            # mostra os erros do wrangler como anotações, para se lerem sem abrir o registo
            grep -E "ERROR|error|code: [0-9]+|workers.dev|Authentication|permission" deploy.log | head -8 | while IFS= read -r line; do
              echo "::error title=wrangler::$(echo "$line" | tr -d '\r' | cut -c1-300)"
            done
            exit $code
          fi
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "::notice title=Servidor de avisos::${url:-endereço não encontrado no registo}"
